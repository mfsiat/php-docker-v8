; Security hardening defaults for the PHP 8.5 image.
; Override per project with a mounted .ini file or PHP_INI_SCAN_DIR.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
allow_url_include = Off
cgi.fix_pathinfo = 0

; Session hardening
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Enable when the application is served over HTTPS:
; session.cookie_secure = 1

; Optional additional hardening. Test against your application before enabling:
; open_basedir = /var/www/html:/tmp
; disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
